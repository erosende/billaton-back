name: Deploy Billaton Backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: billaton-backend
  CONTAINER_NAME: billaton-app

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test Application
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Run tests
      run: mvn clean test
    
    - name: Generate test report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Maven Tests
        path: '**/target/surefire-reports/*.xml'
        reporter: java-junit

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    name: Build and Deploy
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn clean package -DskipTests
    
    - name: Build Docker image
      run: |
        docker build -t ${{ env.IMAGE_NAME }}:latest .
        docker tag ${{ env.IMAGE_NAME }}:latest ${{ env.IMAGE_NAME }}:${{ github.sha }}
    
    - name: Save Docker image
      run: docker save ${{ env.IMAGE_NAME }}:latest | gzip > billaton-backend.tar.gz
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: billaton-backend.tar.gz
        retention-days: 1

  deploy:
    runs-on: self-hosted
    needs: build
    if: github.ref == 'refs/heads/main'
    name: Deploy to Production
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: docker-image
    
    - name: Load Docker image
      run: docker load < billaton-backend.tar.gz
    
    - name: Stop existing container
      run: |
        docker stop ${{ env.CONTAINER_NAME }} || true
        docker rm ${{ env.CONTAINER_NAME }} || true
      continue-on-error: true
    
    - name: Deploy new container
      run: |
        docker run -d \
          --name ${{ env.CONTAINER_NAME }} \
          --restart unless-stopped \
          -p 8080:8080 \
          -e BILLATON_DB_URL="${{ secrets.BILLATON_DB_URL }}" \
          -e BILLATON_DB_USERNAME="${{ secrets.BILLATON_DB_USERNAME }}" \
          -e BILLATON_DB_PASSWORD="${{ secrets.BILLATON_DB_PASSWORD }}" \
          -e R2_ACCESS_KEY="${{ secrets.R2_ACCESS_KEY }}" \
          -e R2_SECRET_KEY="${{ secrets.R2_SECRET_KEY }}" \
          -e R2_DOCUMENTS_BUCKET="${{ secrets.R2_DOCUMENTS_BUCKET }}" \
          -e R2_IMAGES_BUCKET="${{ secrets.R2_IMAGES_BUCKET }}" \
          -e R2_ENDPOINT="${{ secrets.R2_ENDPOINT }}" \
          -e SUPABASE_JWT_SECRET="${{ secrets.SUPABASE_JWT_SECRET }}" \
          -e PORT=8080 \
          ${{ env.IMAGE_NAME }}:latest
    
    - name: Wait for application startup
      run: |
        for i in {1..30}; do
          if curl -f http://localhost:8080/api/actuator/health; then
            echo "Application is healthy!"
            exit 0
          fi
          echo "Waiting for application to start... ($i/30)"
          sleep 10
        done
        echo "Application failed to start"
        exit 1
    
    - name: Clean up old images
      run: |
        docker image prune -f --filter "until=24h"
        docker container prune -f --filter "until=24h"