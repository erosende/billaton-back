name: Deploy Billaton Backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: billaton-backend
  CONTAINER_NAME: billaton-backend

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test Application
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Run tests
      run: mvn clean test

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    name: Build and Deploy
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn clean package -DskipTests
    
    - name: Build Docker image
      run: |
        docker build -t ${{ env.IMAGE_NAME }}:latest .
        docker tag ${{ env.IMAGE_NAME }}:latest ${{ env.IMAGE_NAME }}:${{ github.sha }}
    
    - name: Save Docker image
      run: docker save ${{ env.IMAGE_NAME }}:latest | gzip > billaton-backend.tar.gz
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: billaton-backend.tar.gz
        retention-days: 1

  deploy:
    runs-on: self-hosted
    needs: build
    if: github.ref == 'refs/heads/main'
    name: Deploy to Production
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Verify runner environment
      run: |
        echo "Runner info:"
        whoami
        pwd
        docker --version
        echo "Available space:"
        df -h
    
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: docker-image
    
    - name: Verify artifact
      run: |
        echo "Downloaded files:"
        ls -la
        echo "Artifact size:"
        du -h billaton-backend.tar.gz
    
    - name: Load Docker image
      run: |
        echo "Loading Docker image..."
        docker load < billaton-backend.tar.gz
        echo "Available images:"
        docker images | grep billaton || echo "No billaton images found"
    
    - name: Check existing containers
      run: |
        echo "Current containers:"
        docker ps -a --filter "name=${{ env.CONTAINER_NAME }}" || true
    
    - name: Stop existing container
      run: |
        echo "Stopping existing container..."
        if docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null; then
          echo "Container stopped successfully"
        else
          echo "No container to stop or failed to stop"
        fi
        
        if docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null; then
          echo "Container removed successfully"
        else
          echo "No container to remove or failed to remove"
        fi
    
    - name: Verify secrets
      run: |
        echo "Checking secrets configuration..."
        if [ -z "${{ secrets.BILLATON_DB_URL }}" ]; then echo "ERROR: BILLATON_DB_URL not set"; exit 1; fi
        if [ -z "${{ secrets.BILLATON_DB_USERNAME }}" ]; then echo "ERROR: BILLATON_DB_USERNAME not set"; exit 1; fi
        if [ -z "${{ secrets.BILLATON_DB_PASSWORD }}" ]; then echo "ERROR: BILLATON_DB_PASSWORD not set"; exit 1; fi
        echo "Basic secrets validation passed"
    
    - name: Deploy new container
      run: |
        echo "Starting new container..."
        docker run -d \
          --name ${{ env.CONTAINER_NAME }} \
          --restart unless-stopped \
          -p 8080:8080 \
          -e BILLATON_DB_URL="${{ secrets.BILLATON_DB_URL }}" \
          -e BILLATON_DB_USERNAME="${{ secrets.BILLATON_DB_USERNAME }}" \
          -e BILLATON_DB_PASSWORD="${{ secrets.BILLATON_DB_PASSWORD }}" \
          -e R2_ACCESS_KEY="${{ secrets.R2_ACCESS_KEY }}" \
          -e R2_SECRET_KEY="${{ secrets.R2_SECRET_KEY }}" \
          -e R2_DOCUMENTS_BUCKET="${{ secrets.R2_DOCUMENTS_BUCKET }}" \
          -e R2_IMAGES_BUCKET="${{ secrets.R2_IMAGES_BUCKET }}" \
          -e R2_ENDPOINT="${{ secrets.R2_ENDPOINT }}" \
          -e SUPABASE_JWT_SECRET="${{ secrets.SUPABASE_JWT_SECRET }}" \
          -e PORT=8080 \
          ${{ env.IMAGE_NAME }}:latest
        
        echo "Container started. Checking status..."
        sleep 5
        docker ps --filter "name=${{ env.CONTAINER_NAME }}"
    
    - name: Check container logs
      if: always()
      run: |
        echo "Container logs (last 50 lines):"
        docker logs --tail=50 ${{ env.CONTAINER_NAME }} || echo "Failed to get logs"

    - name: Clean up old images
      if: success()
      run: |
        echo "Cleaning up old Docker resources..."
        docker image prune -f --filter "until=24h"
        docker container prune -f --filter "until=24h"
        echo "Cleanup completed"