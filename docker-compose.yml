version: '3.8'

services:
  app:
    image: billaton-backend:latest
    container_name: billaton-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=pro
      - BILLATON_DB_URL=${BILLATON_DB_URL}
      - BILLATON_DB_USERNAME=${BILLATON_DB_USERNAME}
      - BILLATON_DB_PASSWORD=${BILLATON_DB_PASSWORD}
      - R2_ACCESS_KEY=${R2_ACCESS_KEY}
      - R2_SECRET_KEY=${R2_SECRET_KEY}
      - R2_DOCUMENTS_BUCKET=${R2_DOCUMENTS_BUCKET}
      - R2_IMAGES_BUCKET=${R2_IMAGES_BUCKET}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - db
    networks:
      - billaton-network

  db:
    image: postgres:15-alpine
    container_name: billaton-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-billaton}
      - POSTGRES_USER=${POSTGRES_USER:-billaton}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-billaton}"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - billaton-network

volumes:
  postgres_data:
    driver: local

networks:
  billaton-network:
    driver: bridge